*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
h1,h2,h3{font-family:Montserrat,sans-serif;color:var(--primary)}
header{background:var(--head);color:var(--head-text);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand .sym{height:40px;width:auto}.brand .wm{height:24px;width:auto}
.hdiv{width:1px;height:32px;background:rgba(229,225,221,.25)}
header h1{font-size:16px;margin:0;color:var(--head-text);font-weight:600;line-height:1.3}header .sub{font-size:12px;color:var(--head-sub)}
header .sp{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,button,textarea{font:inherit;color:inherit}
header select{background:var(--head-ctrl);color:var(--head-text);border:1px solid var(--head-ctrl-line);border-radius:6px;padding:6px 8px}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px}
header .btn{background:var(--head-ctrl);border-color:var(--head-ctrl-line);color:var(--head-text)}.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.icon{display:inline-flex;align-items:center;justify-content:center;padding:6px 8px;line-height:1}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
nav.tabs{display:flex;gap:4px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--primary);border-bottom-color:var(--gold)}
main{padding:20px 22px 60px;max-width:1500px;margin:0 auto}
h2{font-size:17px;margin:22px 0 10px}h3{font-size:14px;margin:0 0 8px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.kpi .v{font-size:26px;font-weight:700;color:var(--primary);font-family:Montserrat}.kpi .l{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--surface-3);border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--mteal)}.bar.gold i{background:var(--gold)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px;box-shadow:0 0 0 1px var(--dot-ring)}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.neu{background:var(--surface-3);color:var(--gold-text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--text);max-width:100%}
.filters input[type=search]{min-width:220px;flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{background:var(--th);color:var(--th-text);text-align:left;font-size:12px;font-weight:600;padding:8px 10px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;font-size:13px}
tr.done td{background:var(--donerow)}tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.id,.ltr{direction:ltr;unicode-bidi:isolate;font-family:Inter,sans-serif}.id{font-weight:700;color:var(--primary);white-space:nowrap}
.deps{direction:ltr;unicode-bidi:isolate;font-size:12px;color:var(--text);text-align:left}
.deps b{font-weight:600}.deps .dn{color:var(--ok);text-decoration:line-through}
.st{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);color:var(--text);font-size:12px}
.st[data-v="done"]{background:var(--okbg);border-color:var(--okline)}.st[data-v="progress"]{background:var(--prog)}.st[data-v="review"]{background:var(--warnbg)}.st[data-v="blocked"]{background:var(--badbg)}
.flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.notebtn{border:0;background:none;color:var(--link);cursor:pointer;font-size:12px;padding:0}
.note{font-size:12px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.sprint{border-inline-start:4px solid var(--primary)}.sprint.surge{border-inline-start-color:var(--gold)}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}.chk:first-of-type{border-top:0}.chk input{margin-top:5px;accent-color:var(--mteal)}
dialog{border:0;border-radius:10px;padding:0;max-width:560px;width:92vw;background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(2,16,22,.55)}
dialog .hd{background:var(--head);color:var(--head-text);padding:12px 16px;font-weight:700}dialog .bd{padding:16px}
dialog textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface-2);color:var(--text)}
.log{max-height:160px;overflow:auto;font-size:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--head);color:var(--head-text);border:1px solid var(--head-ctrl-line);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}.toast.on{opacity:1}
.mini{font-size:12px;color:var(--muted)}.hide{display:none}
.ro .ed{display:none!important}.st:disabled{opacity:1;color:var(--text);appearance:none;-webkit-appearance:none;cursor:default}
header .who{font-size:12px;color:var(--head-sub);white-space:nowrap}header .who.on{color:var(--head-text);font-weight:600}
#login input{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface-2);color:var(--text)}
@media(max-width:720px){main{padding:14px}header{padding:10px 14px;position:static}.brand .wm,.hdiv{display:none}nav.tabs{padding:0 8px}td,th{padding:6px}.hidem{display:none}.filters select{flex:1 1 140px}}

function setStatus(id,v){S.t[id]=S.t[id]||{};S.t[id].s=v;S.t[id].at=new Date().toISOString();S.t[id].by=ED;send({op:'status',id,v});}
function addNote(id,x){S.t[id]=S.t[id]||{};(S.t[id].n=S.t[id].n||[]).push({d:new Date().toISOString(),x,by:ED});send({op:'note',id,x});}
const TABS=[['overview','Overview'],['tasks','Tasks'],['sprints','Sprints and hand-offs'],['blocked','Blocked and late'],['activity','Activity'],['future','Future work']];
function tabs(){document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" class="${S.ui.tab===k?'on':''}">${l}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.ui.tab=b.dataset.k;save();render();});}
function render(){tabs();({overview,tasks,sprints,blocked,activity,future})[S.ui.tab](document.getElementById('main'));}
function overview(m){
 const all=D.tasks,cs=D.tasks.filter(t=>t.sprint==S.cur),bl=D.tasks.filter(t=>st(t.id)==='blocked').length,lt=D.tasks.filter(late).length,sp=D.sprints[S.cur];
 let h=`<div class="grid g4">
 <div class="card kpi"><div class="v">${Math.round(pct(all)*100)}%</div><div class="l">Tasks done (all)</div><div class="bar gold"><i style="width:${pct(all)*100}%"></i></div></div>
 <div class="card kpi"><div class="v ltr">${all.filter(t=>st(t.id)==='done').length}/${all.length}</div><div class="l">Tasks done</div></div>
 <div class="card kpi"><div class="v">${Math.round(pct(cs)*100)}%</div><div class="l">Sprint ${S.cur} done</div><div class="bar"><i style="width:${pct(cs)*100}%"></i></div></div>
 <div class="card kpi"><div class="v" style="color:${bl+lt?'var(--bad)':'var(--primary)'}"><span class="ltr">${bl} · ${lt}</span></div><div class="l">Blocked · late</div></div></div>
 <div class="card sprint ${sp.surge?'surge':''}" style="margin-top:12px"><div class="mini">${sp.ms} · ${esc(sp.msn)}${sp.surge?' · Surge sprint':''}</div><h3 style="margin-top:4px">Sprint ${S.cur} — ${esc(sp.theme)}</h3><div>${esc(sp.goal)}</div></div>
 <h2>Progress by team</h2><div class="grid g3">`;
 for(const k of ORDER){const l=D.tasks.filter(t=>t.team===k),c=l.filter(t=>t.sprint==S.cur);
  h+=`<div class="card"><h3><span class="dot" style="background:${TC[k]}"></span>${D.teams[k]}</h3><div class="mini">All ${Math.round(pct(l)*100)}% · <span class="ltr">${l.filter(t=>st(t.id)==='done').length}/${l.length}</span> tasks</div><div class="bar gold"><i style="width:${pct(l)*100}%"></i></div>
  <div class="mini" style="margin-top:8px">Sprint ${S.cur}: ${Math.round(pct(c)*100)}% · <span class="ltr">${c.filter(t=>st(t.id)==='done').length}/${c.length}</span> tasks · ${c.filter(t=>st(t.id)==='blocked').length} blocked</div><div class="bar"><i style="width:${pct(c)*100}%"></i></div></div>`;}
 h+=`</div><h2>Sprint status</h2><div class="grid g4">`;
 for(const s of Object.keys(D.sprints)){const[r,c,p]=rag(+s);h+=`<div class="card"><b class="ltr">Sprint ${s}</b> <span class="pill ${c}">${r}</span><div class="bar"><i style="width:${p*100}%"></i></div><div class="mini">${Math.round(p*100)}% done · ${D.sprints[s].ms}</div></div>`;}
 h+=`</div><p class="mini">Rule at the sprint review: Green when 90% or more of the sprint tasks are done, Amber from 70% to 90%, Red below 70%.</p>`;
 m.innerHTML=h;}
function tasks(m){
 const f=S.ui.f,opt=(a,v)=>a.map(([k,l])=>`<option value="${k}" ${v==k?'selected':''}>${l}</option>`).join('');
 m.innerHTML=`<div class="filters"><input type="search" id="q" placeholder="Search by ID or task" value="${esc(f.q||'')}">
 <select id="ft">${opt([['','All teams'],...ORDER.map(k=>[k,D.teams[k]])],f.team)}</select>
 <select id="fs">${opt([['','All sprints'],...Object.keys(D.sprints).map(s=>[s,'Sprint '+s])],f.sprint)}</select>
 <select id="fst">${opt([['','All statuses'],...STATUSES,['ready','Ready to start'],['late','Late']],f.st)}</select>
 <select id="ff">${opt([['','All features'],...Object.entries(D.features).map(([k,v])=>[k,k+' '+v])],f.feat)}</select>
 <button class="btn" id="clr">Clear filters</button></div><div id="tw" class="tw"></div>`;
 const bind=(id,k)=>{const el=document.getElementById(id);el.oninput=()=>{S.ui.f[k]=el.value;save();table();};};
 bind('q','q');bind('ft','team');bind('fs','sprint');bind('fst','st');bind('ff','feat');
 document.getElementById('clr').onclick=()=>{S.ui.f={};save();render();};table();}
function depHtml(t,cross){const l=t.deps.filter(d=>byId[d]&&((byId[d].team!==t.team)===cross));if(!l.length)return'—';
 return l.map(d=>`<span class="${st(d)==='done'?'dn':''}"><b>${d}</b>${cross?' ('+SHORT[byId[d].team]+')':''}</span>`).join(' ');}
function table(){
 const f=S.ui.f,q=(f.q||'').toLowerCase();
 const l=D.tasks.filter(t=>(!f.team||t.team===f.team)&&(!f.sprint||t.sprint==f.sprint)&&(!f.feat||t.feat===f.feat)&&(!q||(t.id+' '+t.title+' '+t.short).toLowerCase().includes(q))
  &&(!f.st||(f.st==='ready'?(st(t.id)==='todo'&&ready(t)):f.st==='late'?late(t):st(t.id)===f.st)));
 let h=`<div class="mini" style="margin-bottom:6px">${l.length} tasks · ${Math.round(pct(l)*100)}% done</div><table><thead><tr><th>ID</th><th>Task</th><th class="hidem">Team</th><th>Sprint</th><th class="hidem">Needs from own team</th><th class="hidem">Needs from other teams</th><th>Status</th></tr></thead><tbody>`;
 for(const t of l){const s=st(t.id),n=(S.t[t.id]&&S.t[t.id].n)||[],wait=t.deps.filter(d=>byId[d]&&st(d)!=='done');
  h+=`<tr class="${s==='done'?'done':''} ${late(t)?'late':''}"><td class="id">${t.id}</td><td><b>${esc(t.title)}</b><div class="mini" style="margin-top:2px">${esc(t.desc)}</div><div class="flags">${late(t)?'<span class="pill bad">Late</span>':''}${doneLate(t)?`<span class="pill warn">Done late · S${S.t[t.id].cs}</span>`:''}${s==='todo'&&!wait.length?'<span class="pill ok">Ready</span>':''}${wait.length&&s!=='done'?`<span class="pill warn">Waits for ${wait.length}</span>`:''}<span class="mini ltr">${t.feat}</span></div>
  ${n.length?`<div class="note">📝 ${esc(n[n.length-1].x)}</div>`:''}<button class="notebtn" data-id="${t.id}">${n.length?`Notes (${n.length})`:ED?'Add note':''}</button></td>
  <td class="hidem"><span class="dot" style="background:${TC[t.team]}"></span>${SHORT[t.team]}</td><td class="ltr">S${t.sprint}</td><td class="hidem deps">${depHtml(t,false)}</td><td class="hidem deps">${depHtml(t,true)}</td>
  <td><select class="st" data-id="${t.id}" data-v="${s}" ${ED?'':'disabled'} title="${S.t[t.id]&&S.t[t.id].by?'Last change by '+esc(S.t[t.id].by):''}">${STATUSES.map(([k,lb])=>`<option value="${k}" ${k===s?'selected':''}>${lb}</option>`).join('')}</select>${S.t[t.id]&&S.t[t.id].at?`<div class="mini">${stamp(S.t[t.id].at,S.t[t.id].by)}</div>`:''}</td></tr>`;}
 document.getElementById('tw').innerHTML=h+'</tbody></table>';
 document.querySelectorAll('select.st').forEach(e=>e.onchange=()=>{setStatus(e.dataset.id,e.value);if(e.value==='blocked'&&!((S.t[e.dataset.id].n||[]).length)){openNote(e.dataset.id);toast('A blocked task needs a note with the reason');}else toast(e.dataset.id+' → '+lbl(e.value));table();});
 document.querySelectorAll('.notebtn').forEach(b=>b.onclick=()=>openNote(b.dataset.id));}
let dlgId=null;
function openNote(id){dlgId=id;const t=byId[id];document.getElementById('dlgT').textContent=id+' · '+t.short;
 document.getElementById('dlgS').textContent=`${D.teams[t.team]} · Sprint ${t.sprint} · ${t.title}`;document.getElementById('dlgN').value='';
 const n=(S.t[id]&&S.t[id].n)||[];document.getElementById('dlgL').innerHTML=n.length?n.slice().reverse().map(x=>`<div><b class="ltr">${new Date(x.d).toLocaleString()}</b>${x.by?' · '+esc(x.by):''} — ${esc(x.x)}</div>`).join(''):'<span class="mini">No notes yet.</span>';
 try{document.getElementById('dlg').showModal();}catch(e){document.getElementById('dlg').setAttribute('open','');}loadHist(id);}
async function loadHist(id){const el=document.getElementById('dlgH');el.innerHTML='<span class="mini">Loading history…</span>';
 try{const l=(await api('/api/log?task='+encodeURIComponent(id)+'&limit=200')).log.filter(x=>x.op==='status');if(dlgId!==id)return;
  el.innerHTML='<b>Status history</b>'+(l.length?l.map(x=>`<div><b class="ltr">${fmt(x.d)}</b> · ${esc(x.by||'')} — ${esc(lbl(x.old)||x.old)} → ${esc(lbl(x.new)||x.new)} <span class="mini">(during Sprint ${x.cs})</span></div>`).join(''):'<div class="mini">No status changes recorded yet.</div>');}
 catch(e){el.textContent='';}}
document.getElementById('dlgC').onclick=()=>document.getElementById('dlg').close();
document.getElementById('dlgA').onclick=()=>{const v=document.getElementById('dlgN').value.trim();if(!v)return;addNote(dlgId,v);openNote(dlgId);if(S.ui.tab==='tasks')table();else render();toast('Note saved');};
function sprints(m){
 let h='<p class="mini">Tick the hand-offs at the FRR and the done-when items at the sprint review. Ticks are shared with everyone; only editors can change them.</p>';
 for(const s of Object.keys(D.sprints)){const sp=D.sprints[s],[r,c,p]=rag(+s);
  h+=`<div class="card sprint ${sp.surge?'surge':''}" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div class="mini">${sp.ms} · ${esc(sp.msn)}${sp.surge?' · Surge sprint':''}</div><h3 style="margin:2px 0"><span class="ltr">Sprint ${s}</span> — ${esc(sp.theme)}</h3><div class="mini">${sp.rel?'Release <span class="ltr">'+sp.rel+'</span>':'No release'}</div></div>
  <div style="text-align:right"><span class="pill ${c}">${r}</span><div class="mini">${Math.round(p*100)}% done</div></div></div><p style="margin:8px 0">${esc(sp.goal)}</p>
  <div class="grid g3"><div><h3>Handed off at the FRR</h3>${sp.handoffs.map((x,i)=>{const k=s+'-'+i;return`<label class="chk"><input type="checkbox" data-h="${k}" ${S.h[k]?'checked':''} ${ED?'':'disabled'}><span><b>${esc(x.name)}</b> → ${esc(x.to)}<br><span class="mini ltr">${esc(x.items)}</span>${chk('h:'+k)}</span></label>`}).join('')}</div>
  <div><h3>Done when</h3>${sp.exits.map((x,i)=>{const k=s+'-'+i;return`<label class="chk"><input type="checkbox" data-x="${k}" ${S.x[k]?'checked':''} ${ED?'':'disabled'}><span>${esc(x)}${chk('x:'+k)}</span></label>`}).join('')}</div>
  <div><h3>Progress by team</h3>${ORDER.map(k=>{const l=D.tasks.filter(t=>t.team===k&&t.sprint==s);if(!l.length)return'';const pp=pct(l);return`<div class="mini" style="margin-top:6px"><span class="dot" style="background:${TC[k]}"></span>${D.teams[k]} · <span class="ltr">${l.filter(t=>st(t.id)==='done').length}/${l.length}</span></div><div class="bar"><i style="width:${pp*100}%"></i></div>`}).join('')}</div></div></div>`;}
 m.innerHTML=h;
 m.querySelectorAll('input[data-h]').forEach(e=>e.onchange=()=>{S.h[e.dataset.h]=e.checked;send({op:'check',kind:'h',k:e.dataset.h,v:e.checked});});
 m.querySelectorAll('input[data-x]').forEach(e=>e.onchange=()=>{S.x[e.dataset.x]=e.checked;send({op:'check',kind:'x',k:e.dataset.x,v:e.checked});});}
function blocked(m){
 const b=D.tasks.filter(t=>st(t.id)==='blocked'),l=D.tasks.filter(late),r=D.tasks.filter(t=>t.sprint==S.cur&&st(t.id)==='todo'&&!ready(t));
 const row=t=>{const n=(S.t[t.id]&&S.t[t.id].n)||[];return`<tr><td class="id">${t.id}</td><td>${esc(t.title)}${S.t[t.id]&&S.t[t.id].at?`<div class="mini">${lbl(st(t.id))} since ${stamp(S.t[t.id].at,S.t[t.id].by)} (${ago(S.t[t.id].at)})</div>`:''}${n.length?`<div class="note">📝 ${esc(n[n.length-1].x)}</div>`:''}</td><td><span class="dot" style="background:${TC[t.team]}"></span>${SHORT[t.team]}</td><td class="ltr">S${t.sprint}</td><td class="deps">${t.deps.filter(d=>byId[d]&&st(d)!=='done').map(d=>d+' ('+SHORT[byId[d].team]+')').join(' ')||'—'}</td></tr>`};
 const tb=(title,l,empty)=>`<h2>${title} <span class="mini">(${l.length})</span></h2>`+(l.length?`<div class="tw"><table><thead><tr><th>ID</th><th>Task</th><th>Team</th><th>Sprint</th><th>Waiting for</th></tr></thead><tbody>${l.map(row).join('')}</tbody></table></div>`:`<p class="mini">${empty}</p>`);
 m.innerHTML=tb('Blocked',b,'Nothing is blocked.')+tb('Late (sprint passed, not done)',l,'Nothing is late.')+tb('Finished late (done after its sprint)',D.tasks.filter(doneLate),'Nothing was finished late.')+tb(`Sprint ${S.cur} tasks still waiting on something`,r,'Every not-started task in this sprint is ready.');}
async function activity(m){m.innerHTML='<p class="mini">Loading…</p>';let l;
 try{l=(await api('/api/log?limit=500')).log;}catch(e){m.innerHTML='<p class="mini">Could not load the activity log.</p>';return;}
 if(S.ui.tab!=='activity')return;
 const who=[...new Set(l.map(x=>x.by).filter(Boolean))].sort(),f=S.ui.af||'',sl=f?l.filter(x=>x.by===f):l;
 const task=id=>byId[id]?`<span class="id">${esc(id)}</span> ${esc(byId[id].short)}`:esc(id);
 const row=x=>{let what='',chg='';
  if(x.op==='status'){const t=byId[x.target];what=task(x.target);chg=`${esc(lbl(x.old)||x.old)} → <b>${esc(lbl(x.new)||x.new)}</b>`;
   if(x.new==='done'&&t&&x.cs>t.sprint)chg+=` <span class="pill warn">Late: planned S${t.sprint}, done in S${x.cs}</span>`;}
  else if(x.op==='note'){what=task(x.target);chg='📝 '+esc(String(x.new||'').slice(0,200));}
  else if(x.op==='check'){const[s,i]=x.target.slice(2).split('-'),sp=D.sprints[s]||{};
   what=x.target[0]==='h'?`Sprint ${s} hand-off: ${esc(((sp.handoffs||[])[i]||{}).name||'')}`:`Sprint ${s} done-when: ${esc((sp.exits||[])[i]||'')}`;chg=x.new==='1'?'Ticked':'Unticked';}
  else if(x.op==='cur'){what='Current sprint';chg=`Sprint ${esc(x.old)} → <b>Sprint ${esc(x.new)}</b>`;}
  return`<tr><td class="ltr" style="white-space:nowrap">${fmt(x.d)}<div class="mini">${ago(x.d)}</div></td><td>${esc(x.by||'')}</td><td>${what}</td><td>${chg}</td><td class="ltr hidem">S${x.cs}</td></tr>`;};
 m.innerHTML=`<p class="mini">Every change with its time and who made it, newest first (last 500).</p><div class="filters"><select id="af"><option value="">Everyone</option>${who.map(w=>`<option value="${esc(w)}" ${w===f?'selected':''}>${esc(w)}</option>`).join('')}</select></div>`+
  (sl.length?`<div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Change</th><th class="hidem">During</th></tr></thead><tbody>${sl.map(row).join('')}</tbody></table></div>`:'<p class="mini">No changes yet.</p>');
 document.getElementById('af').onchange=e=>{S.ui.af=e.target.value;save();render();};}
function future(m){
 m.innerHTML='<p class="mini">Kept for later; not built in the MVP.</p><div class="tw"><table><thead><tr><th>Team</th><th>Items</th><th>Description</th><th>Requirement</th></tr></thead><tbody>'+
 D.future.map(f=>`<tr><td>${esc(f.team)}</td><td class="id">${esc(f.items)}</td><td>${esc(f.desc)}</td><td class="deps">${esc(f.req)}</td></tr>`).join('')+'</tbody></table></div>';}
const cur=document.getElementById('cur');cur.innerHTML=Object.keys(D.sprints).map(s=>`<option value="${s}">Sprint ${s}</option>`).join('');cur.value=S.cur;
cur.onchange=()=>{S.cur=+cur.value;if(ED)send({op:'cur',v:S.cur});else viewerCur=S.cur;render();};
document.getElementById('exp').onclick=()=>{const b=new Blob([JSON.stringify({app:'atlantech-tracker',v:2,exported:new Date().toISOString(),state:{cur:S.cur,t:S.t,h:S.h,x:S.x}},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='atlantech-progress-sprint'+S.cur+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
const lg=document.getElementById('login'),lk=document.getElementById('loginK');
document.getElementById('auth').onclick=()=>{if(ED){KEYV=null;try{localStorage.removeItem(AKEY);}catch(e){}setRole(null);toast('Signed out');return;}
 lk.value='';try{lg.showModal();}catch(e){lg.setAttribute('open','');}lk.focus();};
document.getElementById('loginC').onclick=()=>lg.close();
const doLogin=async()=>{const k=lk.value.trim();if(!k)return;KEYV=k;await checkAuth();
 if(ED){try{localStorage.setItem(AKEY,k);}catch(e){}lg.close();toast('Signed in as '+ED);}else{KEYV=null;toast('Wrong editor key');}};
document.getElementById('loginA').onclick=doLogin;lk.onkeydown=e=>{if(e.key==='Enter')doLogin();};
const thBtn=document.getElementById('theme'),mq=matchMedia('(prefers-color-scheme: dark)');
const SUN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const curTheme=()=>document.documentElement.dataset.theme||(mq.matches?'dark':'light');
function paintTheme(){const d=curTheme()==='dark';thBtn.innerHTML=d?SUN:MOON;thBtn.title=d?'Switch to light mode':'Switch to dark mode';thBtn.setAttribute('aria-label',thBtn.title);}
thBtn.onclick=()=>{const t=curTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('atlantech-theme',t);}catch(e){}paintTheme();};
mq.addEventListener('change',paintTheme);paintTheme();
document.getElementById('main').innerHTML='<p class="mini">Loading…</p>';
checkAuth();refresh();
setInterval(()=>{if(document.visibilityState==='visible')refresh();},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});
</script></body></html>
