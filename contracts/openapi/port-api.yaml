# ATLANTECH port API · OpenAPI 3.0 (CT-02)
#
# Source of truth: project-backend ATLANTECH/openapi/port-api.yaml, owned by the Backend Team (DEC-13).
# Every PR that adds or changes an endpoint updates this file in the same PR; tests/Feature/Api/OpenApiDriftTest.php
# fails when routes and paths, or error codes and ErrorCode, differ. Published to PortHub
# contracts/openapi/port-api.yaml with `composer contracts:openapi` (paired PortHub PR).
# Conventions: CT-01 (api-conventions.md, error-codes.md). Minor bump per endpoint PR; a breaking change is a major bump and /api/v2.
openapi: 3.0.3
info:
  title: ATLANTECH Port API
  version: '1.14.0'
  description: |
    The port API used by the web app (Vue) and the mobile app (Flutter).

    - Every path starts with `/api/v1`. A breaking change means `/api/v2` next to v1.
    - Times are ISO 8601 in UTC with microseconds on output (`2026-11-02T10:15:04.123456Z`); input must carry
      `Z` or an offset (`+02:00`), a value without one is refused with 422.
    - Every error is `application/problem+json` (RFC 9457) with a stable `code` and a `message_key`.
    - Lists take `?page=&per_page=` and return `{ "data": [...], "meta": { "page", "per_page", "total" } }`.
    - Editable records return `version` (the `updated_at` value) as an opaque token; every update sends it back, and a stale one is refused with 409.
  contact:
    name: ATLANTECH Backend Team
servers:
  - url: /
    description: The port server; paths carry the full /api/v1 prefix.
tags:
  - name: Auth
    description: >-
      Web sign-in with the Sanctum SPA session (CT-03; first call `GET /sanctum/csrf-cookie`), and mobile sign-in with a
      device token (CT-04). Signed-in routes take either the session cookie or `Authorization: Bearer`.
  - name: Audit
    description: Audit log browsing for the Port Admin (FR-MD-16).
  - name: System
    description: Public port information for the mobile app (CT-04).
  - name: Master data
    description: Terminals and berths for the port set-up (FR-MD-03 to FR-MD-05, DEC-51).
  - name: Users
    description: User administration, roles and devices for the Port Admin (FR-AC-09 to FR-AC-13).
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Web sign-in
      description: >-
        Signs a user in with `username` and password (DEC-35) and starts a new session (new session id).
        Call `GET /sanctum/csrf-cookie` first and send its value as `X-XSRF-TOKEN`. The username is trimmed and
        lowercased. A wrong username and a wrong password get the same 401, with the `detail` "The username or password is incorrect.". A user with `must_change_password`
        still signs in, with the flag set, and must then call `POST /api/v1/auth/change-password`. Throttled at 5 failed
        attempts per minute per username and IP, and 20 per minute per IP. A request whose Origin or Referer is
        not a web-app origin the server treats as stateful (SANCTUM_STATEFUL_DOMAINS) has no session to start and
        answers 400 BAD_REQUEST before the credentials are checked.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; the response sets the session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '419':
          $ref: '#/components/responses/SessionExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /api/v1/auth/mobile/login:
    post:
      tags: [Auth]
      operationId: authMobileLogin
      summary: Mobile sign-in
      description: >-
        Signs a field user in from the tablet and returns an opaque device token (CT-04). Checked in this order: the
        `X-App-Version` (`x.y.z`) and `X-Device-Id` headers (422), the app version against `min_app_version` (426, no
        token), the body (422), then the credentials exactly as the web sign-in (429, 401, 403 ACCOUNT_DISABLED). A
        device the Port Admin revoked answers 403 DEVICE_REVOKED. The device row is created or updated, an older token of
        the same device is revoked, and the new token is named with the device id. Each use moves `expires_at` to 30 days
        later; an expired or revoked token answers 401. No `Idempotency-Key`: a token is never replayed.
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
      responses:
        '200':
          description: 'Signed in; send the token as `Authorization: Bearer` with `X-App-Version` and `X-Device-Id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSignIn'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '403 ACCOUNT_DISABLED, or 403 DEVICE_REVOKED for a device the Port Admin revoked.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                accountDisabled:
                  value:
                    type: https://atlantech.io/errors/account-disabled
                    title: 'Account disabled'
                    status: 403
                    code: ACCOUNT_DISABLED
                    message_key: errors.account_disabled
                    detail: 'Your account has been disabled. Contact your port administrator.'
                deviceRevoked:
                  value:
                    type: https://atlantech.io/errors/device-revoked
                    title: 'Device revoked'
                    status: 403
                    code: DEVICE_REVOKED
                    message_key: errors.device_revoked
                    detail: 'This device has been revoked by your port administrator. Contact your port administrator to use it again.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: Signed-in user's profile
      description: >-
        The profile of the user the session belongs to, the same shape as the sign-in answer. The web app calls it
        after a page reload to know who is signed in. It stays open while `must_change_password` is set, and a
        deactivated user gets 403 and is signed out.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: authChangePassword
      summary: Change the signed-in user's password
      description: >-
        Saves the new password, clears `must_change_password` and starts a new session id. While the flag is set, every
        signed-in route except this one, `auth/me` and logout answers 403 PASSWORD_CHANGE_REQUIRED. The new password
        has at least 8 characters with letters and numbers, and differs from the current one. The user's other sessions close, as on the web: the other web sessions end by themselves, and every other
        mobile token of the user is revoked (`revoked_at` is set, the rows stay). The token or session that made the
        change stays valid. Throttled at 5 requests
        per minute per user. A Bearer request needs an `Idempotency-Key` (CT-01 section 4).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XsrfTokenWebOnly'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: >-
            Changed; the updated profile, with `must_change_password` false. A retry with the same `Idempotency-Key` and body
            gets this response again.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '419':
          $ref: '#/components/responses/SessionExpired'
        '422':
          description: >-
            422 VALIDATION_FAILED (the fields, or the `Idempotency-Key` header missing or malformed on a Bearer request) or 422
            IDEMPOTENCY_KEY_REUSED (the key was used for another request).
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationProblem'
                  - $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  value:
                    type: https://atlantech.io/errors/validation-failed
                    title: 'Validation failed'
                    status: 422
                    code: VALIDATION_FAILED
                    message_key: errors.validation_failed
                    detail: 'The Idempotency-Key field is required.'
                    errors:
                      Idempotency-Key:
                        - validation.required
                idempotencyKeyReused:
                  value:
                    type: https://atlantech.io/errors/idempotency-key-reused
                    title: 'Idempotency key reused'
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    message_key: errors.idempotency_key_reused
                    detail: 'This request key was already used for a different request. Send the request again with a new key.'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
        '503':
          description: >-
            503 SERVICE_UNAVAILABLE. A Bearer request with an `Idempotency-Key` whose first request is still running answers
            503 with `Retry-After`; send the same request again with the same key.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Sign out
      description: >-
        Web: ends the session. Mobile: revokes the Bearer token the request carries (`revoked_at` is set, the row stays);
        the user's other devices keep their tokens (CT-04). It stays open while `must_change_password` is set. The next
        signed-in request with the same session or token is 401. A Bearer request needs an `Idempotency-Key`; a retry with
        the same key replays the 204.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XsrfTokenWebOnly'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: >-
            Signed out. A mobile retry with the same `Idempotency-Key` after a lost response gets 204 again (the token is
            revoked by then, so without the key it would be 401).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '419':
          $ref: '#/components/responses/SessionExpired'
        '422':
          description: >-
            422 VALIDATION_FAILED (the `Idempotency-Key` header missing or malformed on a Bearer request, or a missing or
            malformed `X-Device-Id` or `X-App-Version`) or 422 IDEMPOTENCY_KEY_REUSED (the key was used for another request).
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationProblem'
                  - $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  value:
                    type: https://atlantech.io/errors/validation-failed
                    title: 'Validation failed'
                    status: 422
                    code: VALIDATION_FAILED
                    message_key: errors.validation_failed
                    detail: 'The Idempotency-Key field is required.'
                    errors:
                      Idempotency-Key:
                        - validation.required
                idempotencyKeyReused:
                  value:
                    type: https://atlantech.io/errors/idempotency-key-reused
                    title: 'Idempotency key reused'
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    message_key: errors.idempotency_key_reused
                    detail: 'This request key was already used for a different request. Send the request again with a new key.'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
        '503':
          description: >-
            503 SERVICE_UNAVAILABLE. A Bearer request with an `Idempotency-Key` whose first request is still running answers
            503 with `Retry-After`; send the same request again with the same key.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: auditLogsList
      summary: Browse the audit log
      description: >-
        The port audit log, newest first (`occurred_at`, then `id`, descending), for the Port Admin (`PORT_GM`, ability
        `audit.read`). Master-data history is the same list filtered by entity: `entity_type` is the table name and
        `entity_id` the row, for example `?entity_type=berths&entity_id=3`. Rows written for a refused request have
        `action` REJECTED_ATTEMPT; `actor` is null for the system or a worker. A read, so it is allowed in every licence mode.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: entity_type
          in: query
          required: false
          description: Table name of the changed record, for example `berths`.
          schema:
            type: string
            maxLength: 60
        - name: entity_id
          in: query
          required: false
          description: Id of the changed record. Use with `entity_type`.
          schema:
            type: integer
            minimum: 1
        - name: actor_id
          in: query
          required: false
          description: The user who made the change.
          schema:
            type: integer
            minimum: 1
        - name: action
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: from
          in: query
          required: false
          description: Rows at or after this instant. ISO 8601 with `Z` or an offset; a time without one is 422. Not after `to`.
          schema:
            $ref: '#/components/schemas/DateTime'
        - name: to
          in: query
          required: false
          description: Rows at or before this instant. Same format as `from`.
          schema:
            $ref: '#/components/schemas/DateTime'
        - name: q
          in: query
          required: false
          description: Text search on the actor, a case-insensitive part of the username or name.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: A page of audit rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
  /api/v1/users:
    get:
      tags: [Users]
      operationId: usersList
      summary: List users
      description: >-
        Users for the Port Admin (`PORT_GM`, ability `users.manage`), ordered by name. Filters: `is_active`, and `q` (part of the name or username).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
    post:
      tags: [Users]
      operationId: usersCreate
      summary: Create a user
      description: >-
        Creates an active user with a server-generated one-time password, returned in this response only (`one_time_password`);
        the user must change it at first sign-in. Refused with 422 PLAN_LIMIT_EXCEEDED above the plan's user limit. A Bearer request needs an `Idempotency-Key`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XsrfTokenWebOnly'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created. `one_time_password` is shown once and stored only as a hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: '422 VALIDATION_FAILED, or 422 PLAN_LIMIT_EXCEEDED when the plan allows no more active users.'
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationProblem'
                  - $ref: '#/components/schemas/Problem'
        '419':
          $ref: '#/components/responses/SessionExpired'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
  /api/v1/users/{user}:
    get:
      tags: [Users]
      operationId: usersShow
      summary: Show a user with the role history
      description: >-
        The user with the active role and every role assignment, newest first (DEC-36).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
  /api/v1/users/{user}/deactivate:
    post:
      tags: [Users]
      operationId: usersDeactivate
      summary: Deactivate a user
      description: >-
        Sets `is_active` to false under a row lock; the user is refused on the next request. Nobody can deactivate themselves or the last active Port Admin (409 CONFLICT). Already inactive: 200, nothing changes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XsrfTokenWebOnly'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: The user with the new `version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '409 VERSION_CONFLICT (stale `version`) or 409 CONFLICT (a business rule: yourself, the last active Port Admin).'
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/VersionConflictProblem'
                  - $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '419':
          $ref: '#/components/responses/SessionExpired'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
  /api/v1/users/{user}/activate:
    post:
      tags: [Users]
      operationId: usersActivate
      summary: Activate a user
      description: >-
        Sets `is_active` to true; counts as adding a user for the plan limit (422 PLAN_LIMIT_EXCEEDED). Already active: 200, nothing changes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XsrfTokenWebOnly'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: The user with the new `version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: '422 VALIDATION_FAILED, or 422 PLAN_LIMIT_EXCEEDED when the plan allows no more active users.'
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationProblem'
                  - $ref: '#/components/schemas/Problem'
        '419':
          $ref: '#/components/responses/SessionExpired'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
  /api/v1/users/{user}/roles:
    post:
      tags: [Users]
      operationId: usersAssignRole
      summary: Give a user a role
      description: >-
        Ends the user's active role and inserts the new one in one transaction (DEC-36). `terminal_id` is required for the three `TERMINAL_*` roles and refused for any other. Replacing the last active Port Admin role is 409 CONFLICT. The same role and unit again: 200, nothing changes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XsrfTokenWebOnly'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '200':
          description: The user with the active role, the history and the new `version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '409 VERSION_CONFLICT (stale `version`) or 409 CONFLICT (the last active Port Admin).'
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/VersionConflictProblem'
                  - $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '419':
          $ref: '#/components/responses/SessionExpired'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
  /api/v1/users/{user}/roles/end:
    post:
      tags: [Users]
      operationId: usersEndRole
      summary: End a user's role
      description: >-
        Sets `active_to` on the active role; the user is left without a role (403 on every request). Ending the last active Port Admin role is 409 CONFLICT. No active role: 200, nothing changes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XsrfTokenWebOnly'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
