        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/AppUpdateRequired'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: atlantech_session
      description: >-
        Web app: Laravel session cookie (Sanctum SPA, CT-03). Writes also send the `X-XSRF-TOKEN` header
        (parameter XsrfToken). The name is config session.cookie (SESSION_COOKIE, default atlantech_session).
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Mobile app: personal access token (CT-04). A Bearer request must send `X-App-Version` (`x.y.z`) and `X-Device-Id`:
        either one missing or malformed is 422 VALIDATION_FAILED, another device or a revoked one is 401, and a version
        older than `min_app_version` is 426. Web requests (session cookie) may omit `X-App-Version`. Writes send `Idempotency-Key`.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number, from 1. A page past the end returns 200 with empty data; out of range is 422.
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Items per page. Out of range is 422 (never clamped).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Web writes; the value of the XSRF-TOKEN cookie (Sanctum SPA).
      schema:
        type: string
    XsrfTokenWebOnly:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: >-
        Web session only: the value of the XSRF-TOKEN cookie (Sanctum SPA). A mobile request that authenticates with
        `Authorization: Bearer` does not send it and is never refused for its absence.
      schema:
        type: string
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: >-
        Mobile app version, `x.y.z`. Required on mobile sign-in and on every Bearer request (missing or malformed is 422);
        older than the port's minimum gives 426 APP_UPDATE_REQUIRED. A web request (session cookie) may omit it.
      schema:
        type: string
        example: '2.4.0'
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Stable id of the mobile device.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Required on every write (POST, PUT, PATCH, DELETE) made with `Authorization: Bearer`, except `POST /sync/events`
        (CT-07, `client_event_id`); a missing or malformed key is 422 VALIDATION_FAILED. UUID v4, one per logical write,
        reused on every retry of it, kept 24 h per token. Same key and same request (method, path and query, body): the first response
        is replayed, with status, body and the header `Idempotent-Replayed: true`, and the write does not run again. Same
        key with another request: 422 IDEMPOTENCY_KEY_REUSED. Not stored, so a retry runs again: 5xx, 401, 408, 423, 426,
        429. A web session request does not send it and is never refused for its absence.
      schema:
        type: string
        format: uuid
    UserId:
      name: user
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TerminalId:
      name: terminal
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BerthId:
      name: berth
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DeviceRowId:
      name: device
      in: path
      required: true
      description: The `id` of a device of this user (not the `device_id` string).
      schema:
        type: integer
        minimum: 1
  headers:
    Allow:
      description: Methods the path supports.
      schema:
        type: string
        example: GET, HEAD
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        example: 60
    IdempotentReplayed:
      description: >-
        `true` when the response is the stored first response of the same `Idempotency-Key` (Bearer writes); absent on the
        first response. A stored 4xx is replayed with it too.
      schema:
        type: string
        enum: ['true']
  schemas:
    DateTime:
      type: string
      format: date-time
      description: ISO 8601 in UTC with microseconds on output; input must carry Z or an offset.
      example: '2026-11-02T10:15:04.123456Z'
    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      example:
        page: 1
        per_page: 25
        total: 132
    ErrorCode:
      type: string
      description: Stable error code (CT-01 error-codes.md); never changes once CT-01 is approved.
      enum:
        - VALIDATION_FAILED
        - VERSION_CONFLICT
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - ACCOUNT_DISABLED
        - PASSWORD_CHANGE_REQUIRED
        - DEVICE_REVOKED
        - APP_UPDATE_REQUIRED
        - LICENSE_READ_ONLY
        - PLAN_LIMIT_EXCEEDED
        - TOO_MANY_ATTEMPTS
        - IDEMPOTENCY_KEY_REUSED
        - SERVICE_UNAVAILABLE
        - SERVER_ERROR
        - BAD_REQUEST
        - CONFLICT
    Problem:
      type: object
      description: RFC 9457 problem body. `detail` is English; clients translate by `message_key`.
      required: [type, title, status, code, message_key, detail]
      properties:
        type:
          type: string
          format: uri
          description: Identifier of the problem (https://atlantech.io/errors/<kebab-code>), not a page.
        title:
          type: string
          description: Short English title per code.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        message_key:
          type: string
          pattern: '^errors\.[a-z0-9_]+(\.[a-z0-9_]+)?$'
          description: Translation key, errors.<lower_snake code> or errors.<area>.<name> for feature keys.
        detail:
          type: string
    ValidationProblem:
      description: 422 VALIDATION_FAILED; `errors` maps each field to its failed rules as message keys.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                minItems: 1
                items:
                  type: string
                  example: validation.required
    VersionConflictProblem:
      description: 409 VERSION_CONFLICT; `current` is the stored record's id and version token.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [current]
          properties:
            current:
              type: object
              required: [id, version]
              properties:
                id:
                  type: integer
                version:
                  $ref: '#/components/schemas/DateTime'
    AppUpdateRequiredProblem:
      description: 426 APP_UPDATE_REQUIRED; `min_app_version` is the port's minimum mobile version.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [min_app_version]
          properties:
            min_app_version:
              type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 255
        new_password_confirmation:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: Trimmed and lowercased by the server before it is checked.
          example: staff.ahmed
        password:
          type: string
          maxLength: 255
          format: password
    MobileLoginRequest:
      type: object
      required: [username, password, platform]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: Trimmed and lowercased by the server before it is checked.
          example: pilot.k
        password:
          type: string
          maxLength: 255
          format: password
        platform:
          type: string
          enum: [ANDROID, IOS]
          example: ANDROID
    MobileSignIn:
      type: object
      description: The mobile sign-in answer (CT-04).
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: Opaque device token.
          example: 12|Hk3s9QxV0pLw2mN8rT5yZb7cD1fG4jK6aE0uI3oP9s2a5b8c
        expires_at:
          type: string
          format: date-time
          description: The expiry at sign-in; each use moves it to 30 days later.
          example: '2026-12-02T10:00:00.000000Z'
        user:
          $ref: '#/components/schemas/UserProfile'
    PortProfile:
      type: object
      description: The port's profile (P-26). One row per port server.
      required: [id, public_id, port_code, governorate_code, name, latitude, longitude, timezone, boundary_coordinates, version]
      properties:
        id:
          type: integer
          example: 1
        public_id:
          type: string
          format: uuid
          description: The SaaS registry value; read-only.
        port_code:
          type: string
          nullable: true
          description: UN/LOCODE; read-only.
          example: EGDAM
        governorate_code:
          type: string
          description: ISO 3166-2:EG; read-only.
          example: EG-DT
        name:
          type: string
          example: Damietta Port
        latitude:
          type: number
          example: 31.45
        longitude:
          type: number
          example: 31.76
        timezone:
          type: string
          description: IANA time zone.
          example: Africa/Cairo
        boundary_coordinates:
          type: object
          nullable: true
          description: GeoJSON Polygon with [longitude, latitude] positions.
        version:
          type: string
          example: '2026-11-27T10:15:04.123456Z'
    UpdatePortProfileRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          maxLength: 150
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
          maxLength: 64
          example: Africa/Cairo
        boundary_coordinates:
          type: object
          nullable: true
          description: GeoJSON Polygon with closed rings of [longitude, latitude] positions.
        version:
          type: string
          description: The `version` last read.
    ChannelWaypoint:
      type: object
      required: [sequence_order, label, latitude, longitude]
      properties:
        sequence_order:
          type: integer
          minimum: 1
        label:
          type: string
          maxLength: 60
          example: Fairway Buoy
        latitude:
          type: number
        longitude:
          type: number
    NavigationChannel:
      type: object
      required: [id, name, depth, depth_datum, width, speed_limit_knots, is_active, version, waypoints]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
          example: Main Channel
        depth:
          type: number
          description: Controlling charted depth in metres, below `depth_datum`.
          example: 17.5
        depth_datum:
          type: string
          maxLength: 40
          example: LAT
        width:
          type: number
          description: Metres.
          example: 300
        speed_limit_knots:
          type: number
          example: 8
        is_active:
          type: boolean
          example: true
        version:
          type: string
          example: '2026-11-27T10:15:04.123456Z'
        waypoints:
          type: array
          items:
            $ref: '#/components/schemas/ChannelWaypoint'
    NavigationChannelPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NavigationChannel'
        meta:
          $ref: '#/components/schemas/PageMeta'
    StoreNavigationChannelRequest:
      type: object
      required: [name, depth, depth_datum, width, speed_limit_knots]
      properties:
        name:
          type: string
          maxLength: 100
          example: Main Channel
        depth:
          type: number
          description: Controlling charted depth in metres, below `depth_datum`.
          example: 17.5
        depth_datum:
          type: string
          maxLength: 40
          example: LAT
        width:
          type: number
          description: Metres.
          example: 300
        speed_limit_knots:
          type: number
          example: 8
    UpdateNavigationChannelRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          maxLength: 100
          example: Main Channel
        depth:
          type: number
          description: Controlling charted depth in metres, below `depth_datum`.
          example: 17.5
        depth_datum:
          type: string
          maxLength: 40
          example: LAT
        width:
          type: number
          description: Metres.
          example: 300
        speed_limit_knots:
          type: number
          example: 8
        version:
          type: string
          description: The `version` last read.
    ReplaceChannelWaypointsRequest:
      type: object
      required: [waypoints, version]
      properties:
        waypoints:
          type: array
          description: The whole list in travel order.
          items:
            type: object
            required: [label, latitude, longitude]
            properties:
              label:
                type: string
                maxLength: 60
                example: Fairway Buoy
              latitude:
                type: number
                minimum: -90
                maximum: 90
              longitude:
                type: number
                minimum: -180
                maximum: 180
        version:
          type: string
          description: The channel's `version` last read.
    PortSetting:
      type: object
      required: [setting_key, value_type, value, min, max, description, updated_by, version]
      properties:
        setting_key:
          type: string
          example: reminder_lead_minutes
        value_type:
          type: string
          enum: [INT, DECIMAL, BOOL, STRING, JSON]
        value:
          description: Has the JSON type of `value_type`.
          example: 120
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        description:
          type: string
          nullable: true
        updated_by:
          type: integer
          nullable: true
          description: The user who last changed the value; null while it is the seeded default.
        version:
          type: string
          example: '2026-11-27T10:15:04.123456Z'
    PortSettingPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortSetting'
        meta:
          $ref: '#/components/schemas/PageMeta'
    UpdatePortSettingRequest:
      type: object
      required: [value, version]
      properties:
        value:
          description: The new value, with the JSON type of the setting's `value_type`.
          example: 90
        version:
          type: string
          description: The `version` last read.
    ProductivityProfile:
      type: object
      required: [id, terminal_id, vessel_type_id, productivity_rate, rate_unit, fixed_overhead_minutes, valid_from, valid_to, version]
      properties:
        id:
          type: integer
        terminal_id:
          type: integer
        vessel_type_id:
          type: integer
          nullable: true
          description: Null is the terminal's default profile.
        productivity_rate:
          type: number
          description: Above 0, at most 2 decimals.
          example: 28.5
        rate_unit:
          type: string
          enum: [MOVES_PER_HOUR, TONNES_PER_HOUR, CUBIC_METRES_PER_HOUR, UNITS_PER_HOUR]
          description: Only `MOVES_PER_HOUR` is accepted (container terminals).
        fixed_overhead_minutes:
          type: integer
          minimum: 0
          example: 90
        valid_from:
          type: string
          format: date
          example: '2027-01-01'
        valid_to:
          type: string
          format: date
          nullable: true
          description: Included in the period; null leaves it open.
        version:
          type: string
          example: '2026-11-27T10:15:04.123456Z'
    ProductivityProfilePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductivityProfile'
        meta:
          $ref: '#/components/schemas/PageMeta'
    StoreProductivityProfileRequest:
      type: object
      required: [productivity_rate, rate_unit, fixed_overhead_minutes, valid_from]
      properties:
        vessel_type_id:
          type: integer
          nullable: true
          description: Null is the terminal's default profile.
        productivity_rate:
          type: number
          description: Above 0, at most 2 decimals.
          example: 28.5
        rate_unit:
          type: string
          enum: [MOVES_PER_HOUR, TONNES_PER_HOUR, CUBIC_METRES_PER_HOUR, UNITS_PER_HOUR]
          description: Only `MOVES_PER_HOUR` is accepted (container terminals).
        fixed_overhead_minutes:
          type: integer
          minimum: 0
          example: 90
        valid_from:
          type: string
          format: date
          example: '2027-01-01'
        valid_to:
          type: string
          format: date
          nullable: true
          description: Included in the period; null leaves it open.
    UpdateProductivityProfileRequest:
      type: object
      required: [version]
      properties:
        vessel_type_id:
          type: integer
          nullable: true
          description: Null is the terminal's default profile.
        productivity_rate:
          type: number
          description: Above 0, at most 2 decimals.
          example: 28.5
        rate_unit:
          type: string
          enum: [MOVES_PER_HOUR, TONNES_PER_HOUR, CUBIC_METRES_PER_HOUR, UNITS_PER_HOUR]
          description: Only `MOVES_PER_HOUR` is accepted (container terminals).
        fixed_overhead_minutes:
          type: integer
          minimum: 0
          example: 90
        valid_from:
          type: string
          format: date
          example: '2027-01-01'
        valid_to:
          type: string
          format: date
          nullable: true
          description: Included in the period; null leaves it open.
        version:
          type: string
          description: The `version` last read.
    SystemInfo:
      type: object
      description: Public port information (CT-04 v1.1).
      required: [port_id, port_code, port_name, license_mode, token_warning_days_left, min_app_version]
      properties:
        port_id:
          type: string
          format: uuid
          description: '`port_profiles.public_id`.'
          example: 0d9f6a52-7c1b-4b7e-9a3e-5a2f1c8d7e10
        port_code:
          type: string
          nullable: true
          description: UN/LOCODE; may be null.
          example: EGDAM
        port_name:
          type: string
          example: Damietta Port
        license_mode:
          type: string
          enum: [SETUP, FULL, READ_ONLY]
          description: Always `FULL` until the licence work (DEC-54).
          example: FULL
        token_warning_days_left:
          type: integer
          nullable: true
          description: Always null until the licence work (DEC-54).
          example: null
        min_app_version:
          type: string
          description: The oldest mobile app version the port accepts (`x.y.z`); older apps get 426.
          example: 1.0.0
    UserProfile:
      type: object
      description: The signed-in user (CT-03). One active role (DEC-36); `role` is null when the user has none.
      required: [id, name, role, terminal_ids, must_change_password]
      properties:
        id:
          type: integer
          example: 41
        name:
          type: string
          example: Port Staff
        role:
          type: string
          nullable: true
          enum: [PORT_GM, PORT_STAFF, MARINE_SAFETY_OFFICER, PILOTAGE_MANAGER, PILOTAGE_OFFICER, MARINE_PILOT, TUG_MANAGER, TUG_OFFICER, TUG_MASTER, TERMINAL_ADMIN, TERMINAL_OFFICER, TERMINAL_SUPERVISOR, null]
          example: PORT_STAFF
        terminal_ids:
          type: array
          description: The terminal of a TERMINAL role; empty for every other role.
          items:
            type: integer
          example: []
        must_change_password:
          type: boolean
          example: false
    RoleAssignment:
      type: object
      required: [role, organization_unit_id, unit_type, terminal_id, active_from, active_to]
      properties:
        role:
          type: string
          enum: [PORT_GM, PORT_STAFF, MARINE_SAFETY_OFFICER, PILOTAGE_MANAGER, PILOTAGE_OFFICER, MARINE_PILOT, TUG_MANAGER, TUG_OFFICER, TUG_MASTER, TERMINAL_ADMIN, TERMINAL_OFFICER, TERMINAL_SUPERVISOR]
        organization_unit_id:
          type: integer
        unit_type:
          type: string
          enum: [HARBOUR_AUTHORITY, MARINE_SERVICES, TERMINAL]
        terminal_id:
          type: integer
          nullable: true
        active_from:
          $ref: '#/components/schemas/DateTime'
        active_to:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
    User:
      type: object
      required: [id, name, username, phone, is_active, must_change_password, version, created_at, active_role]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        version:
          type: string
          description: Opaque version token; send it back with every update.
        created_at:
          $ref: '#/components/schemas/DateTime'
        active_role:
          allOf:
            - $ref: '#/components/schemas/RoleAssignment'
          nullable: true
    UserDetail:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [role_history]
          properties:
            role_history:
              type: array
              description: Every assignment, newest first.
              items:
                $ref: '#/components/schemas/RoleAssignment'
    CreatedUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [one_time_password]
          properties:
            one_time_password:
              type: string
              description: 20 characters, shown in this response only.
    CreateUserRequest:
      type: object
      required: [name, username]
      properties:
        name:
          type: string
          maxLength: 120
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-z0-9._-]+$'
          description: Lowercased by the server; unique.
        phone:
          type: string
          maxLength: 30
          nullable: true
    VersionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The record's `version` as last read.
    AssignRoleRequest:
      type: object
      required: [role, version]
      properties:
        role:
          type: string
          enum: [PORT_GM, PORT_STAFF, MARINE_SAFETY_OFFICER, PILOTAGE_MANAGER, PILOTAGE_OFFICER, MARINE_PILOT, TUG_MANAGER, TUG_OFFICER, TUG_MASTER, TERMINAL_ADMIN, TERMINAL_OFFICER, TERMINAL_SUPERVISOR]
        terminal_id:
          type: integer
          minimum: 1
          description: Required for TERMINAL_ADMIN, TERMINAL_OFFICER and TERMINAL_SUPERVISOR; refused for any other role.
        version:
          type: string
    UserDevice:
      type: object
      required: [id, device_id, platform, app_version, last_seen_at, revoked_at, has_push_token, live_token_count]
      properties:
        id:
          type: integer
        device_id:
          type: string
        platform:
          type: string
          enum: [ANDROID, IOS]
        app_version:
          type: string
        last_seen_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        revoked_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        has_push_token:
          type: boolean
        live_token_count:
          type: integer
          description: Tokens that are neither revoked nor expired.
    RevokeAllResult:
      type: object
      required: [devices_revoked, tokens_revoked]
      properties:
        devices_revoked:
          type: integer
        tokens_revoked:
          type: integer
    GeoJsonPolygon:
      type: object
      description: >-
        A GeoJSON Polygon with `[longitude, latitude]` positions; every ring has at least four positions and is closed (the
        first position equals the last).
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    TerminalType:
      type: string
      enum: [CONTAINER, NON_CONTAINER]
    BerthStatus:
      type: string
      description: Administrative status only; reserved or occupied comes from the plans.
      enum: [ACTIVE, MAINTENANCE, INACTIVE]
    Terminal:
      type: object
      required: [id, code, name, terminal_type, boundary_coordinates, is_active, version]
      properties:
        id:
          type: integer
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 120
        terminal_type:
          $ref: '#/components/schemas/TerminalType'
        boundary_coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoJsonPolygon'
          nullable: true
        is_active:
          type: boolean
        version:
          type: string
          description: Opaque version token; send it back with every update.
        berths_count:
          type: integer
          description: In the list only. How many berths the terminal may use (a shared berth counts for each of its terminals).
    TerminalDetail:
      allOf:
        - $ref: '#/components/schemas/Terminal'
        - type: object
          required: [berths]
          properties:
            berths:
              type: array
              items:
                type: object
                required: [id, code, name, status]
                properties:
                  id:
                    type: integer
                  code:
                    type: string
                  name:
                    type: string
                    nullable: true
                  status:
                    $ref: '#/components/schemas/BerthStatus'
    Berth:
      type: object
      required: [id, code, name, length, water_depth, depth_datum, max_vessel_loa, status, latitude, longitude, version, terminals]
      properties:
        id:
          type: integer
        code:
          type: string
          maxLength: 30
        name:
          type: string
          nullable: true
        length:
          type: number
          description: Metres.
        water_depth:
          type: number
          description: Metres below `depth_datum`.
        depth_datum:
          type: string
          example: LAT
        max_vessel_loa:
          type: number
          description: Metres; never more than `length`.
        status:
          $ref: '#/components/schemas/BerthStatus'
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        version:
          type: string
          description: Opaque version token; send it back with every update.
        terminals:
          type: array
          description: The terminals that may use the berth; more than one for a shared berth (DEC-51).
          items:
            type: object
            required: [id, code, name, terminal_type, is_active]
            properties:
              id:
                type: integer
              code:
                type: string
              name:
                type: string
              terminal_type:
                $ref: '#/components/schemas/TerminalType'
              is_active:
                type: boolean
    CreateTerminalRequest:
      type: object
      required: [code, name, terminal_type]
      properties:
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 120
        terminal_type:
          $ref: '#/components/schemas/TerminalType'
        boundary_coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoJsonPolygon'
          nullable: true
    UpdateTerminalRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          maxLength: 120
        boundary_coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoJsonPolygon'
          nullable: true
        version:
          type: string
          description: The terminal's `version` as last read.
    CreateBerthRequest:
      type: object
      required: [code, length, water_depth, depth_datum, max_vessel_loa, terminal_ids]
      properties:
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 80
          nullable: true
        length:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
        water_depth:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 9999.99
          multipleOf: 0.01
        depth_datum:
          type: string
          maxLength: 40
        max_vessel_loa:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
          description: Must not exceed `length`.
        latitude:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        terminal_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
    UpdateBerthRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          maxLength: 80
          nullable: true
        length:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
        water_depth:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 9999.99
          multipleOf: 0.01
        depth_datum:
          type: string
          maxLength: 40
        max_vessel_loa:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
        latitude:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        terminal_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
        version:
          type: string
          description: The berth's `version` as last read.
    AuditAction:
      type: string
      enum: [CREATE, UPDATE, DELETE, STATUS_CHANGE, SAFETY_EXCEPTION, REJECTED_ATTEMPT]
    AuditLogEntry:
      type: object
      description: One audit row. `before_state` and `after_state` hold the changed fields; CREATE has no before, DELETE no after, a refusal holds `route`, `status`, `code`, `reason` and `username` in `after_state`.
      required: [id, actor, entity_type, entity_id, action, before_state, after_state, occurred_at]
      properties:
        id:
          type: integer
          example: 9012
        actor:
          type: object
          nullable: true
          description: Null for the system or a worker.
          required: [id, name, username]
          properties:
            id:
              type: integer
              example: 41
            name:
              type: string
              example: Port Admin
            username:
              type: string
              example: port.admin
        entity_type:
          type: string
          example: berths
        entity_id:
          type: integer
          nullable: true
          example: 3
        action:
          $ref: '#/components/schemas/AuditAction'
        before_state:
          type: object
          nullable: true
          additionalProperties: true
          example: {name: 'Berth 3'}
        after_state:
          type: object
          nullable: true
          additionalProperties: true
          example: {name: 'Berth 3 East'}
        occurred_at:
          $ref: '#/components/schemas/DateTime'
  responses:
    Conflict:
      description: '409 CONFLICT. A business rule refused the change; `message_key` of the feature is in `detail` only.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://atlantech.io/errors/conflict
            title: 'Conflict'
            status: 409
            code: CONFLICT
            message_key: errors.conflict
            detail: 'At least one active Port Admin must remain.'
    ValidationFailed:
      description: '422 VALIDATION_FAILED'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: https://atlantech.io/errors/validation-failed
            title: 'Validation failed'
            status: 422
            code: VALIDATION_FAILED
            message_key: errors.validation_failed
            detail: 'The name field is required.'
            errors:
              name:
                - validation.required
    VersionConflict:
      description: '409 VERSION_CONFLICT'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VersionConflictProblem'
          example:
            type: https://atlantech.io/errors/version-conflict
            title: 'Record changed'
            status: 409
            code: VERSION_CONFLICT
            message_key: errors.version_conflict
            detail: 'This record was changed by another user. Reload it and apply your changes again.'
